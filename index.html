<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tactizo Admin</title>
<style>
:root{
  --bg:#f3f4f7; --panel:#ffffff; --panel2:#f8f9fb; --border:#e3e6ec;
  --ink:#1a1d29; --muted:#6b7280; --faint:#9aa0ad;
  --gold:#b9860f; --gold-bg:#fbf2df; --gold-ink:#5c4308;
  --green:#1f9d54; --green-bg:#e9f8ee;
  --orange:#c07a17; --orange-bg:#fdf1de;
  --red:#c73a3a; --red-bg:#fbeaea;
  --blue:#2f6fd6; --blue-bg:#eaf1fd;
  --r:10px; --shadow:0 1px 2px rgba(20,20,30,.04), 0 6px 20px -8px rgba(20,20,30,.10);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);width:100%;min-width:0;}
body{font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
a{color:inherit}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit}
h1,h2,h3{margin:0 0 8px}
.muted{color:var(--muted)}
.faint{color:var(--faint);font-size:12px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

/* ---------- layout ---------- */
#app{display:flex;min-height:100vh;}
#sidebar{width:220px;flex:0 0 220px;background:var(--panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:16px 0;position:sticky;top:0;height:100vh;overflow-y:auto;}
#logo{padding:0 20px 18px;font-weight:800;font-size:18px;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
#logo .dot{width:9px;height:9px;border-radius:50%;background:var(--gold)}
.navlink{display:flex;align-items:center;gap:10px;padding:10px 20px;color:var(--muted);text-decoration:none;
  font-size:13.5px;border-left:3px solid transparent;cursor:pointer;}
.navlink:hover{background:var(--panel2);color:var(--ink)}
.navlink.active{color:var(--ink);border-left-color:var(--gold);background:var(--gold-bg);font-weight:600}
#navspacer{flex:1}
#main{flex:1;min-width:0;padding:28px 32px 60px;max-width:1280px;}

/* ---------- cards / tables ---------- */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);}
.grid{display:grid;gap:16px}
.grid-5{grid-template-columns:repeat(5,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
@media (max-width:1100px){.grid-5{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(2,1fr)}}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;
  padding:8px 10px;border-bottom:1px solid var(--border)}
td{padding:9px 10px;border-bottom:1px solid var(--border2,var(--border))}
tr:last-child td{border-bottom:none}
tr.clickable:hover{background:var(--panel2);cursor:pointer}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:600}
.tag.g{background:var(--green-bg);color:var(--green)}
.tag.o{background:var(--orange-bg);color:var(--orange)}
.tag.r{background:var(--red-bg);color:var(--red)}
.tag.b{background:var(--blue-bg);color:var(--blue)}
.tag.n{background:var(--panel2);color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;border:1px solid var(--border);
  background:var(--panel);color:var(--ink);font-size:13px;font-weight:600}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#3a2c05}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.small{padding:4px 10px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:default}
input[type=text],input[type=password],input[type=number],input[type=email],select{
  padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--ink);width:100%}
.row{display:flex;gap:10px;align-items:center}
.between{display:flex;align-items:center;justify-content:space-between}
.hstack{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ---------- health banner ---------- */
#health-banner{border-radius:var(--r);padding:16px 20px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between}
#health-banner.g{background:var(--green-bg);color:#0e5a30}
#health-banner.o{background:var(--orange-bg);color:#6b4304}
#health-banner.r{background:var(--red-bg);color:#7a1f1f}
#health-banner .big{font-size:16px;font-weight:700}

.voyant{border-radius:var(--r);padding:14px 16px;border:1px solid var(--border);background:var(--panel)}
.voyant .head{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;margin-bottom:8px}
.voyant .led{width:9px;height:9px;border-radius:50%}
.led.g{background:var(--green)} .led.o{background:var(--orange)} .led.r{background:var(--red)} .led.gray{background:#c7cbd4}
.voyant .lines{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px}

.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .v{font-size:24px;font-weight:800}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .cmp{font-size:11.5px}
.cmp.up{color:var(--green)} .cmp.down{color:var(--red)}

.section-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:26px 0 10px}
.section-title:first-child{margin-top:0}

#topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
#topbar h1{font-size:20px}
#lastcheck{font-size:12px;color:var(--faint)}

.modal-overlay{position:fixed;inset:0;background:rgba(20,20,30,.45);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:#fff;border-radius:12px;padding:22px;width:420px;max-width:92vw;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.toast{position:fixed;bottom:20px;right:20px;padding:12px 18px;border-radius:10px;font-size:13.5px;font-weight:600;
  box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:200;max-width:380px}
.toast.ok{background:var(--green);color:#fff}
.toast.err{background:var(--red);color:#fff}

#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg)}
#login-box{background:#fff;padding:36px;border-radius:14px;box-shadow:var(--shadow);width:360px;max-width:90vw}
#login-box .logo{font-weight:800;font-size:22px;margin-bottom:4px}
#login-box .sub{color:var(--muted);font-size:13px;margin-bottom:22px}
.err-msg{color:var(--red);font-size:13px;margin-top:10px}

.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:12px;font-size:13px;color:var(--muted)}
.empty{padding:30px;text-align:center;color:var(--muted);font-size:13.5px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--gold);
  border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
[hidden]{display:none!important}

/* ---------- mobile topbar / drawer nav ---------- */
#mobile-topbar{display:none}
#sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(20,20,30,.45);z-index:140}
#sidebar-overlay.show{display:block}

@media (max-width:880px){
  #mobile-topbar{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--panel);
    border-bottom:1px solid var(--border);position:sticky;top:0;z-index:120}
  #hamburger-btn{background:#fff;border:1px solid var(--border);border-radius:8px;width:40px;height:40px;
    font-size:18px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  #mobile-title{font-weight:800;font-size:16px}
  #app{flex-direction:column}
  #sidebar{position:fixed;top:0;left:-260px;width:240px;height:100vh;z-index:150;transition:left .25s ease}
  #sidebar.open{left:0;box-shadow:8px 0 30px rgba(0,0,0,.25)}
  #main{padding:16px 14px 40px;max-width:100%}
  #topbar{flex-wrap:wrap;gap:8px}
}

/* ---------- small-screen scaling ---------- */
@media (max-width:680px){
  .grid-5,.grid-3,.grid-2{grid-template-columns:1fr}
}
@media (max-width:880px){
  .btn{min-height:40px;padding:9px 14px}
  .btn.small{min-height:34px;padding:6px 12px}
  input[type=text],input[type=password],input[type=number],input[type=email],select{font-size:16px;min-height:40px}
  .row,.hstack{flex-wrap:wrap}
}
@media (max-width:480px){
  .toast{left:20px;right:20px;max-width:none;text-align:center}
}

/* ---------- responsive tables : cards on mobile ---------- */
@media (max-width:720px){
  table:not(.plain){display:block}
  table:not(.plain) thead{display:none}
  table:not(.plain) tbody{display:block}
  table:not(.plain) tr{display:block;border:1px solid var(--border);border-radius:10px;
    margin-bottom:10px;padding:10px 12px;background:var(--panel2)}
  table:not(.plain) tr:last-child{margin-bottom:0}
  table:not(.plain) td{display:flex;justify-content:space-between;gap:10px;border:none;
    padding:4px 0;text-align:right}
  table:not(.plain) td::before{content:attr(data-label);color:var(--muted);font-weight:600;
    font-size:11px;text-transform:uppercase;letter-spacing:.03em;text-align:left}
  table:not(.plain) td:first-child{display:block;text-align:left;font-weight:700;font-size:14.5px;
    border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:4px}
  table.plain td{padding:8px 6px;vertical-align:top}
}
</style>
</head>
<body>

<div id="login-screen">
  <div id="login-box">
    <div class="logo">TACTIZO <span style="color:var(--gold)">ADMIN</span></div>
    <div class="sub">Back-office privé — accès réservé.</div>
    <div class="field"><label>Email</label><input id="login-email" type="email" autocomplete="username"></div>
    <div class="field"><label>Mot de passe</label><input id="login-pass" type="password" autocomplete="current-password"></div>
    <button class="btn primary" id="login-btn" style="width:100%;justify-content:center">Se connecter</button>
    <div class="err-msg" id="login-err" hidden></div>
  </div>
</div>

<div id="app" hidden>
  <div id="mobile-topbar">
    <button class="btn" id="hamburger-btn" aria-label="Menu">☰</button>
    <div id="mobile-title">TACTIZO <span style="color:var(--gold)">Admin</span></div>
  </div>
  <div id="sidebar-overlay"></div>
  <div id="sidebar">
    <div id="logo"><span class="dot"></span>TACTIZO <span style="font-weight:400;color:var(--muted)">Admin</span></div>
    <a class="navlink" data-view="dashboard">🏠 Dashboard</a>
    <a class="navlink" data-view="joueurs">👥 Joueurs</a>
    <a class="navlink" data-view="ligues">🏆 Ligues</a>
    <a class="navlink" data-view="usage">📊 Usage</a>
    <a class="navlink" data-view="monetisation">💰 Monétisation</a>
    <a class="navlink" data-view="systeme">🖥️ Système</a>
    <a class="navlink" data-view="journal">📜 Journal admin</a>
    <div id="navspacer"></div>
    <a class="navlink" id="logout-link">↩ Déconnexion</a>
  </div>
  <div id="main"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4"></script>
<script>
'use strict';
const SB_URL = "https://mdqmhrorpdyrsjsbawdl.supabase.co";
const SB_KEY = "sb_publishable_1xe1X9iIPahncWpQpRkrdg_Hw49QXO0";
const db = window.supabase.createClient(SB_URL, SB_KEY);

let ME = null; // {id, email}
let VIEW = 'dashboard';
const cache = {};

// ---------------------------------------------------------------- helpers
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso); if(isNaN(d)) return '—';
  return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }
function fmtRel(iso){ if(!iso) return '—'; const ms=Date.now()-new Date(iso).getTime(); const m=Math.round(ms/60000);
  if(m<1) return 'à l\'instant'; if(m<60) return 'il y a '+m+' min'; const h=Math.round(m/60); if(h<24) return 'il y a '+h+' h';
  return 'il y a '+Math.round(h/24)+' j'; }
function fmtEuro(n){ if(n==null) return '—'; return Number(n).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'; }
function fmtNum(n){ if(n==null) return '—'; return Number(n).toLocaleString('fr-FR'); }
function fmtPct(n){ if(n==null) return 'Non disponible'; return n+' %'; }
function nd(){ return '<span class="faint">Non disponible</span>'; }
function tag(cls,label){ return `<span class="tag ${cls}">${esc(label)}</span>`; }

async function rpc(name, args){
  const { data, error } = await db.rpc(name, args||{});
  if(error) throw error;
  return data;
}
function toast(msg, ok){
  const t=document.createElement('div'); t.className='toast '+(ok?'ok':'err'); t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 4200);
}

// ---------------------------------------------------------------- auth
async function boot(){
  const { data:{ session } } = await db.auth.getSession();
  if(session){ await tryEnterAdmin(); } else { showLogin(); }
}
function showLogin(msg){
  document.getElementById('login-screen').hidden=false;
  document.getElementById('app').hidden=true;
  const e=document.getElementById('login-err');
  if(msg){ e.textContent=msg; e.hidden=false; } else { e.hidden=true; }
}
async function tryEnterAdmin(){
  let isAdmin=false;
  try{ isAdmin = await rpc('tml_est_admin'); }catch(e){ isAdmin=false; }
  if(!isAdmin){
    await db.auth.signOut();
    showLogin('Ce compte n\'est pas administrateur.');
    return;
  }
  const { data:{ user } } = await db.auth.getUser();
  ME = { id:user.id, email:user.email };
  document.getElementById('login-screen').hidden=true;
  document.getElementById('app').hidden=false;
  goto(location.hash.replace('#','') || 'dashboard');
}
document.getElementById('login-btn').addEventListener('click', async ()=>{
  const email=document.getElementById('login-email').value.trim();
  const pass=document.getElementById('login-pass').value;
  const btn=document.getElementById('login-btn'); btn.disabled=true; btn.textContent='Connexion...';
  try{
    const { error } = await db.auth.signInWithPassword({ email, password: pass });
    if(error) throw error;
    await tryEnterAdmin();
  }catch(e){
    showLogin('Connexion refusée : identifiants incorrects.');
  } finally { btn.disabled=false; btn.textContent='Se connecter'; }
});
document.getElementById('logout-link').addEventListener('click', async ()=>{
  await db.auth.signOut(); ME=null; location.hash=''; showLogin();
});

// ---------------------------------------------------------------- routing
window.addEventListener('hashchange', ()=>{ if(ME) goto(location.hash.replace('#','')||'dashboard'); });
function goto(view){
  VIEW=view; location.hash=view;
  document.querySelectorAll('.navlink[data-view]').forEach(a=>a.classList.toggle('active', a.dataset.view===view));
  render();
}
document.querySelectorAll('.navlink[data-view]').forEach(a=>a.addEventListener('click', ()=>{ goto(a.dataset.view); closeDrawer(); }));

// ---------------------------------------------------------------- mobile drawer nav
const sidebarEl = document.getElementById('sidebar');
const sidebarOverlayEl = document.getElementById('sidebar-overlay');
function openDrawer(){ sidebarEl.classList.add('open'); sidebarOverlayEl.classList.add('show'); }
function closeDrawer(){ sidebarEl.classList.remove('open'); sidebarOverlayEl.classList.remove('show'); }
document.getElementById('hamburger-btn').addEventListener('click', ()=>{
  sidebarEl.classList.contains('open') ? closeDrawer() : openDrawer();
});
sidebarOverlayEl.addEventListener('click', closeDrawer);
document.getElementById('logout-link').addEventListener('click', closeDrawer);

function setMain(html){ document.getElementById('main').innerHTML = html; }
function loadingMain(){ setMain('<div class="empty"><span class="spinner"></span> Chargement…</div>'); }

async function render(){
  try{
    if(VIEW==='dashboard') await renderDashboard();
    else if(VIEW==='joueurs') await renderJoueurs();
    else if(VIEW==='ligues') await renderLigues();
    else if(VIEW==='usage') await renderUsage();
    else if(VIEW==='monetisation') await renderMonetisation();
    else if(VIEW==='systeme') await renderSysteme();
    else if(VIEW==='journal') await renderJournal();
    else await renderDashboard();
  }catch(e){
    setMain(`<div class="card"><b>Erreur de chargement</b><div class="muted" style="margin-top:6px">${esc(e.message||e)}</div></div>`);
  }
}

// ================================================================== DASHBOARD
async function renderDashboard(){
  loadingMain();
  const [health, act7] = await Promise.all([ rpc('admin_bo_health'), rpc('admin_bo_usage_summary',{p_period:'7d'}) ]);
  cache.health = health;

  // ---- verdict global ----
  const alerts = collectAlerts(health);
  const level = alerts.some(a=>a.sev==='r') ? 'r' : (alerts.length ? 'o' : 'g');
  const verdictTxt = level==='g' ? '🟢 Tout fonctionne normalement'
    : level==='o' ? `🟠 ${alerts.length} point${alerts.length>1?'s':''} nécessite${alerts.length>1?'nt':''} ton attention`
    : '🔴 Problème susceptible d\'empêcher les joueurs de jouer';

  const jeu = health.jeu, matchs = health.matchs, api = health.api, integ = health.integrite, tech = health.technique;
  const quota = api.quota_dernier_releve || {};

  const cronsKo = (tech.crons||[]).filter(c=>c.dernier_statut && c.dernier_statut!=='succeeded');
  const techLed = cronsKo.length ? 'r' : 'g';

  const jeuLed = (jeu.ligues_bloquees.length || jeu.running_sans_progression.length) ? 'o' : 'g';
  /* ⚠️ 2026-09-23 (constaté par Hervé au passage de la Ligue A en J1) — « 3 duel(s) de la journée
     active sans affiches » + verdict « 1 point nécessite ton attention », alors que TOUT ÉTAIT
     NORMAL : les 3 joueurs à domicile venaient de recevoir l'action « Choisir les matchs » et
     n'avaient simplement pas encore rempli `duels.fixtures`.
     LE COMPTEUR N'EST PAS FAUX, C'EST SA LECTURE QUI L'ÉTAIT : `duels_sans_fixtures_journee_active`
     (admin_bo_health) compte les duels de la journée active sans affiches — ce qui est l'ÉTAT
     NORMAL de toute journée qui vient de s'ouvrir, et le reste jusqu'à ce que chaque domicile ait
     choisi (ou que le filet `ensure-fixtures-reelles` tire à sa place). Orange dessus, c'est donc
     un faux positif à CHAQUE début de journée de CHAQUE ligue — et un cockpit qui crie pour rien
     finit par ne plus être lu du tout.
     ⚠️ AUCUN DÉLAI D'ALERTE N'EST INVENTÉ ICI, faute d'un délai fiable : distinguer « normal » de
     « anormal » demanderait de comparer l'âge du duel à sa vraie échéance de sélection, qui n'est
     PAS dans ce payload (elle se dérive de `leagues.day_started_at` + la formule de la ligue,
     côté client — cf. `dayTimes()` dans app/index.html). Ce qui reste à décider avant qu'une
     vraie alerte existe : (1) exposer cette échéance dans `admin_bo_health()` ; (2) choisir CE QUI
     est anormal : un duel encore sans affiches APRÈS l'échéance, donc un filet qui n'a pas agi.
     ⚠️ (2026-09-23, second temps) — LES DEUX POINTS SONT FAITS. `admin_bo_health()` expose
     désormais `duels_sans_fixtures_en_retard`, calculé avec `tml_sel_deadline()` : la MÊME règle
     que le filet (`selDeadlineMs`, FAST 12 h / Classique 24 h sur `day_started_at`), posée une
     seule fois en SQL au lieu d'être recopiée une troisième fois.
     On était passé d'une fausse alerte à un SILENCE — un filet en panne ne se voyait nulle part.
     Désormais : gris tant qu'on attend dans les temps, orange dès qu'une échéance est dépassée.
     ⚠️ GRIS, PAS VERT quand on attend : vert dirait « toutes les affiches sont présentes », faux.
     ⚠️ `ligues_actives_sans_day_started_at` est l'AUTRE moitié : sans date de départ, il n'y a pas
     d'échéance, donc le filet reste inerte et AUCUN duel ne sera jamais compté « en retard ». Vécu
     le 23/09 (resolve_prep ne posait pas la date, deux ligues de campagne bloquées en silence) :
     cette panne-là doit s'afficher, sinon le compteur ci-dessus mentirait par omission. */
  const enRetard = matchs.duels_sans_fixtures_en_retard || 0;
  const sansDepart = matchs.ligues_actives_sans_day_started_at || 0;
  const matchLed = (enRetard>0 || sansDepart>0) ? 'o'
                 : (matchs.duels_sans_fixtures_journee_active>0 ? 'gray' : 'g');
  const apiLed = quota.remaining!=null ? (quota.remaining<50?'r':quota.remaining<150?'o':'g') : 'gray';
  const integLed = integ.bet_log_erreurs_24h>0 || integ.ligues_resolve_lock_bloque>0 ? 'o' : 'g';

  setMain(`
    <div id="topbar"><h1>Dashboard</h1><div id="lastcheck">Dernière vérification : ${fmtDate(health.verifie_a)} <button class="btn small" id="refresh-btn" style="margin-left:8px">↻ Actualiser</button></div></div>
    <div id="health-banner" class="${level}"><div class="big">TACTIZO ADMIN — ${verdictTxt}</div></div>

    <div class="section-title">À traiter / à anticiper</div>
    <div class="card" style="margin-bottom:22px">
      ${alerts.length ? `<table class="plain">${alerts.map(a=>`<tr class="${a.href?'clickable':''}" ${a.href?`onclick="goto('${a.href}')"`:''}><td style="width:26px">${a.sev==='r'?'🔴':'🟠'}</td><td>${esc(a.text)}</td></tr>`).join('')}</table>`

function collectAlerts(h){
  const out=[];
  (h.jeu.ligues_bloquees||[]).forEach(l=> out.push({sev:'r', text:`Ligue ${l.code} — resolve_lock bloqué depuis plus de 15 min`, href:'ligues'}));
  (h.jeu.running_sans_progression||[]).forEach(l=> out.push({sev:'o', text:`Ligue ${l.code} — running sans progression depuis plus de 7 jours`, href:'ligues'}));
  const q=h.api.quota_dernier_releve||{};
  if(q.remaining!=null && q.remaining<50) out.push({sev:'r', text:`Quota The Odds API très bas : ${q.remaining} crédits restants`, href:'systeme'});
  else if(q.remaining!=null && q.remaining<150) out.push({sev:'o', text:`Quota The Odds API à surveiller : ${q.remaining} crédits restants`, href:'systeme'});
  /* ⚠️ 2026-09-23 — « duels sans affiches » NE FAIT PLUS PARTIE DES ALERTES (raisonnement complet
     au-dessus de `matchLed`, dans renderDashboard). Ce compteur décrit l'état NORMAL d'une journée
     qui vient de s'ouvrir : il aurait déclenché « X point(s) nécessite(nt) ton attention » à chaque
     début de journée de chaque ligue. L'information reste affichée, en clair, dans le voyant
     MATCHS — elle n'est simplement plus présentée comme une anomalie.
     Orange = quelque chose qui mérite réellement l'attention d'Hervé, jamais un état de marche
     normale — c'est ce qui fait qu'un cockpit reste lu.
     ⚠️ (2026-09-23, second temps) — CE QUI ALERTE MAINTENANT, c'est `duels_sans_fixtures_en_retard`
     et lui seul : des duels dont l'échéance de sélection est DÉPASSÉE et qui n'ont toujours pas
     d'affiches, donc un filet `ensure-fixtures-reelles` qui n'a pas fait son travail. Le compteur
     d'attente, lui, ne doit JAMAIS revenir ici. */
  if(h.matchs.duels_sans_fixtures_en_retard>0)
    out.push({sev:'o', text:`${h.matchs.duels_sans_fixtures_en_retard} duel(s) en retard — tirage automatique attendu`, href:'ligues'});
  /* Sans date de départ de journée, il n'y a pas d'échéance : le filet ne se déclenchera jamais et
     le compteur ci-dessus restera à zéro en mentant. C'est la panne du 23/09, elle doit se voir. */
  if(h.matchs.ligues_actives_sans_day_started_at>0)
    out.push({sev:'o', text:`${h.matchs.ligues_actives_sans_day_started_at} ligue(s) active(s) sans date de départ de journée — le tirage automatique ne peut pas se déclencher`, href:'ligues'});
  const ko=(h.technique.crons||[]).filter(c=>c.dernier_statut && c.dernier_statut!=='succeeded');
  ko.forEach(c=> out.push({sev:'r', text:`Cron "${c.job}" en échec (dernier statut : ${c.dernier_statut})`, href:'systeme'}));
  if(h.integrite.bet_log_erreurs_24h>0) out.push({sev:'o', text:`${h.integrite.bet_log_erreurs_24h} erreur(s) de soumission de pari sur les dernières 24h`});
  return out;
}
function voyant(title, led, lines){
  return `<div class="voyant"><div class="head"><span class="led ${led}"></span>${title}</div><div class="lines">${lines.map(l=>`<div>${l}</div>`).join('')}</div></div>`;
}
function kpi(val, label, cmpHtml){
  return `<div class="card kpi"><div class="v">${val==null?'—':fmtNum(val)}</div><div class="l">${label}</div>${cmpHtml||''}</div>`;
}
function cmp(now, prev){
  if(prev==null || now==null) return '';
  const d=now-prev; if(d===0) return `<div class="cmp muted">= période précédente</div>`;
  return `<div class="cmp ${d>0?'up':'down'}">${d>0?'▲':'▼'} ${Math.abs(d)} vs période précédente</div>`;
}

function actionDeleteLeague(){
  const L = CURRENT_LEAGUE_DETAIL;
  if(!L) return;
  const ov=document.createElement('div'); ov.className='modal-overlay';
  ov.innerHTML=`<div class="modal">
    <h3>⚠️ Supprimer définitivement cette ligue</h3>
    <div class="card" style="background:var(--red-bg);margin-bottom:14px">
      <div style="font-weight:700;font-size:15px;margin-bottom:6px">${esc(L.name)} — <span class="mono">${esc(L.code)}</span></div>
      <div class="faint">Statut : ${esc(L.status)} · Journée ${L.current_day}/${L.num_days} · ${L.data_mode==='real'?'Ligue RÉELLE':'Ligue simulée'} · ${L.nb_joueurs} joueur(s)</div>
    </div>
    <div style="color:var(--red);font-weight:600;font-size:13px;margin-bottom:14px">Cette action est définitive : la ligue, ses paris, duels et rachats seront supprimés sans aucune récupération possible.</div>
    <div class="field"><label>Pour confirmer, retape exactement le code de la ligue (<span class="mono">${esc(L.code)}</span>)</label><input type="text" id="dl-code" autocomplete="off"></div>
    <div class="field"><label>Mot de passe admin (confirmation)</label><input type="password" id="dl-pass"></div>
    <div class="field"><label>Motif de la suppression (obligatoire, conservé dans le journal)</label><input type="text" id="dl-reason"></div>
    <div class="hstack" style="justify-content:flex-end"><button class="btn" id="dl-cancel">Annuler</button><button class="btn danger" id="dl-ok">Supprimer définitivement</button></div>
  </div>`;
  document.body.appendChild(ov);
  ov.querySelector('#dl-cancel').onclick=()=>ov.remove();
  ov.querySelector('#dl-ok').onclick=async ()=>{
    const codeTyped=document.getElementById('dl-code').value.trim();
    const pass=document.getElementById('dl-pass').value;
    const reason=document.getElementById('dl-reason').value.trim();
    if(codeTyped!==L.code){ toast('Le code tapé ne correspond pas.', false); return; }
    if(!pass){ toast('Mot de passe requis.', false); return; }
    if(!reason){ toast('Motif requis.', false); return; }
    const btn=ov.querySelector('#dl-ok'); btn.disabled=true; btn.textContent='Suppression…';
    try{
      await rpc('admin_bo_delete_league', {p_admin_id:ME.id, p_admin_password:pass, p_league_id:L.id, p_league_code:codeTyped, p_reason:reason});
      ov.remove();
      toast('Ligue supprimée.', true);
      renderLigues();
    }catch(e){ toast('Échec : '+(e.message||e), false); btn.disabled=false; btn.textContent='Supprimer définitivement'; }
  };
}

// ================================================================== actions sensibles (confirmation + mot de passe + audit)
function askAdminAction(title, fields, onConfirm){
  const ov=document.createElement('div'); ov.className='modal-overlay';
  ov.innerHTML=`<div class="modal"><h3>${esc(title)}</h3>
    ${fields.map(f=>`<div class="field"><label>${esc(f.label)}</label><input type="${f.type||'text'}" id="mf-${f.id}" ${f.value?('value="'+esc(f.value)+'"'):''}></div>`).join('')}
    <div class="field"><label>Mot de passe admin (confirmation)</label><input type="password" id="mf-pass"></div>
    <div class="field"><label>Motif (facultatif, conservé dans le journal)</label><input type="text" id="mf-reason"></div>
    <div class="hstack" style="justify-content:flex-end"><button class="btn" id="mf-cancel">Annuler</button><button class="btn danger" id="mf-ok">Confirmer</button></div>
  </div>`;
  document.body.appendChild(ov);
  ov.querySelector('#mf-cancel').onclick=()=>ov.remove();
  ov.querySelector('#mf-ok').onclick=async ()=>{
    const vals={}; fields.forEach(f=> vals[f.id]=document.getElementById('mf-'+f.id).value);
    const pass=document.getElementById('mf-pass').value;
    const reason=document.getElementById('mf-reason').value||null;
    if(!pass){ toast('Mot de passe requis.', false); return; }
    const btn=ov.querySelector('#mf-ok'); btn.disabled=true; btn.textContent='En cours…';
    try{ await onConfirm(vals, pass, reason); ov.remove(); }
    catch(e){ toast('Échec : '+(e.message||e), false); btn.disabled=false; btn.textContent='Confirmer'; }
  };
}
